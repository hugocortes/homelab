---
# Let's Encrypt certificates via the Cloudflare DNS-01 challenge.
#
# Issuance and renewal are certbot's job, driven by certbot-renew.timer on the
# host. This playbook only installs and configures that -- running it is a
# setup step, not a renewal step. Renewal happens on its own thereafter.
#
# Replaces a flow where nothing renewed automatically: the certificate was
# reissued only when someone remembered to run this playbook.
- import_playbook: bootstrap.yml

- name: Configure automated certificate renewal
  hosts: acme
  become: false
  gather_facts: false
  tags: acme
  roles:
    - certbot
