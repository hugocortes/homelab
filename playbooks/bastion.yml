---
# SSH bastion with Duo and sish. No bastion host is currently defined in the
# inventory, so this playbook matches no hosts.
- import_playbook: bootstrap.yml

- name: Configure bastion
  hosts: bastion
  become: true
  gather_facts: false
  tags: bastion
  pre_tasks:
    - name: Require bastion and duo settings
      ansible.builtin.fail:
        msg: bastion host and duo settings required
      when: >-
        not (bastion_host | default(''))
        or not (bastion_duo_ikey | default(''))
        or not (bastion_duo_skey | default(''))
        or not (bastion_duo_host | default(''))
  roles:
    - duo
    - ssh_bastion
    - role: sish
      tags: docker/sish
