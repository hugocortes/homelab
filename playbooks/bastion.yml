---
# SSH bastion with Duo and sish. No bastion host is currently defined in the
# inventory, so this playbook matches no hosts.
- import_playbook: bootstrap.yml

- name: Configure bastion
  hosts: bastion
  become: true
  gather_facts: false
  tags: bastion
  pre_tasks:
    - name: Require bastion and duo settings
      ansible.builtin.fail:
        msg: bastion host and duo settings required
      when: >-
        homelab.bastion is undefined or not homelab.bastion.host
        or not homelab.bastion.duo or not homelab.bastion.duo.ikey
        or not homelab.bastion.duo.skey or not homelab.bastion.duo.host
  roles:
    - services/duo
    - services/ssh/bastion
    - role: docker/sish
      tags: docker/sish
