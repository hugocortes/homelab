---
# Baseline host configuration: packages and shell.
#
# Routine maintenance run -- upgrades everything and reboots if the OS says a
# reboot is needed to finish:
#
#     ansible-playbook playbooks/base.yml --tags update
#
# Converge without upgrading (installs anything missing, changes nothing else):
#
#     ansible-playbook playbooks/base.yml --tags packages
#
- import_playbook: bootstrap.yml

# Ahead of the packages play on purpose: that play can reboot, and a disabled
# unit does not come back from one. FreeIPA ships ipa.service as `disabled`,
# so an update run could leave the KDC down while sssd went on answering from
# cache -- an outage that stays quiet until the cache ages out.
#
# Only `enabled` is set, never `state`. This decides what happens at the next
# boot; it will not start IPA underneath someone doing deliberate maintenance.
# The individual units (httpd, krb5kdc, kadmin ...) stay disabled -- ipactl
# supervises those, and enabling them separately fights it.
- name: Keep FreeIPA starting at boot
  hosts: ipaservers:ipareplicas
  become: false
  gather_facts: false
  tags:
    - packages
    - update
    - ipa
  tasks:
    - name: ipa | Enable ipa.service so a reboot does not take auth down
      become: true
      ansible.builtin.systemd:
        name: ipa.service
        enabled: true

- name: Manage packages
  hosts: all
  become: false
  gather_facts: false
  tags:
    - packages
    - update
  roles:
    - role: packages
      vars:
        # `--tags update` and `--tags packages` share this play, so key the
        # upgrade off the tag actually requested rather than hardcoding it.
        packages_upgrade_all: "{{ 'update' in ansible_run_tags }}"

- name: Configure sssd on freeipa-joined hosts
  hosts: all
  become: false
  gather_facts: false
  tags: sssd
  roles:
    - role: sssd
      when: is_freeipa | default(false) | bool

- name: Host maintenance
  hosts: all
  become: false
  gather_facts: false
  tags:
    - maintenance
    - update
  roles:
    - maintenance

- name: Baseline host firewall
  hosts: all
  become: false
  gather_facts: false
  tags: firewall
  roles:
    # firewalld_manage_package is true only here. This is the one place that
    # applies a host's COMPLETE required ingress, so it is the only place where
    # installing and starting firewalld is safe -- starting it elsewhere would
    # apply the stock public zone and cut off everything not yet declared.
    - role: firewalld
      vars:
        firewalld_rule_name: baseline
        firewalld_manage_package: true
        firewalld_services: "{{ firewalld_baseline_services }}"
        firewalld_ports: "{{ firewalld_baseline_ports }}"

- name: Configure terminal
  hosts: all
  become: false
  gather_facts: false
  tags:
    - terminal
    - update
  roles:
    - role: terminal
      vars:
        terminal_upgrade: "{{ 'update' in ansible_run_tags }}"
