---
# Baseline host configuration: packages and shell.
#
# Routine maintenance run -- upgrades everything and reboots if the OS says a
# reboot is needed to finish:
#
#     ansible-playbook playbooks/base.yml --tags update
#
# Converge without upgrading (installs anything missing, changes nothing else):
#
#     ansible-playbook playbooks/base.yml --tags packages
#
- import_playbook: bootstrap.yml

- name: manage packages
  hosts: all
  become: false
  gather_facts: false
  tags:
    - packages
    - update
  roles:
    - role: packages
      vars:
        # `--tags update` and `--tags packages` share this play, so key the
        # upgrade off the tag actually requested rather than hardcoding it.
        packages_upgrade_all: "{{ 'update' in ansible_run_tags }}"

- name: configure terminal
  hosts: all
  become: false
  gather_facts: false
  tags:
    - terminal
    - update
  roles:
    - role: terminal
      vars:
        terminal_upgrade: "{{ 'update' in ansible_run_tags }}"
