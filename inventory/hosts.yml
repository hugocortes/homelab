---
# Fleet definition. Committed: contains no secrets.
# Credentials live in group_vars/*/vault.yml (ansible-vault encrypted).
all:
  vars:
    ansible_become_user: root
    ansible_become_method: sudo
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519
    # every managed host authenticates against FreeIPA as this user
    ansible_user: hugo

  hosts:
    # ops is down and deliberately absent rather than left as a member of
    # ipaclients/servers/docker with no ansible_host -- a dead host in `all`
    # is what forced the ignore_errors/ignore_unreachable prelude (AI-29).
    # To bring it back: uncomment the entry below and add `ops:` under
    # ipaclients, servers and docker.
    # ops:
    #   ansible_host: ops.internal.corteshq.net
    ipa-0:
      ansible_host: ipa-0.homelabops.dev
      certificate_common_name: ipa-0.homelabops.dev
    media:
      ansible_host: media.internal.corteshq.net
    # The T620. 24 cores, ~190GB DDR3, and LGA2011 Xeons with AVX but no AVX2 --
    # which is why llama.cpp is compiled on the host rather than pulled, and why
    # this box will never run el10 (that needs x86-64-v3). See playbooks/llm.yml.
    #
    # ansible_user is pinned here only until the host is enrolled and sssd is
    # answering for `hugo`. Delete the line at that point: the bootstrap role's
    # user swap handles the rest, and root stops being a login at all.
    olympus:
      ansible_host: olympus.internal.corteshq.net
    pirate:
      ansible_host: pirate.internal.corteshq.net

  children:
    homelabops_dev:
      vars:
        cloudflare_domain: homelabops.dev
      children:
        ipaservers:
        ipareplicas:
    auth:
      children:
        ipaservers:
    ipacluster:
      children:
        ipaservers:
        ipareplicas:
        ipaclients:
    ipaservers:
      hosts:
        ipa-0:
    ipareplicas: {}
    ipaclients:
      hosts:
        media:
        olympus:
        pirate:
    # media was here only to mint the pk12 that Plex mounted and never used
    # (secureConnections=0, no customCertificatePath). Nothing on that host
    # reads /etc/ssl/media.internal.corteshq.net now, so it stopped renewing
    # a Let's Encrypt cert for no consumer.
    acme:
      children:
        ipaservers:
        ipareplicas:
    servers:
      children:
        ipaservers:
        ipareplicas:
      hosts:
        media:
        olympus:
        pirate:
    docker:
      children:
        ipaservers:
      hosts:
        media:
        olympus:
        pirate:
