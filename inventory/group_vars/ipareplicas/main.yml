---
ipareplica_domain: ipa.homelabops.dev
ipareplica_realm: IPA.HOMELABOPS.DEV
ipareplica_dirsrv_cert_files: /etc/ssl/{{ ansible_host }}/{{ ansible_host }}.fullchain,/etc/ssl/{{ ansible_host }}/{{ ansible_host }}.key
ipareplica_http_cert_files: /etc/ssl/{{ ansible_host }}/{{ ansible_host }}.fullchain,/etc/ssl/{{ ansible_host }}/{{ ansible_host }}.key
ipareplica_dirsrv_pin: "{{ vault_ipareplica_dirsrv_pin }}"
ipareplica_http_pin: "{{ vault_ipareplica_http_pin }}"
ipareplica_pkinit_pin: "{{ vault_ipareplica_pkinit_pin }}"
ipareplica_no_pkinit: true

# 389-ds serves :636 out of an NSS database, so certbot publishing a PEM does
# nothing for it. Tells the deploy hook to run ipa-server-certinstall -d on
# every renewal. See docs/freeipa-certificates.md for the part that stays
# manual (Let's Encrypt chain rotation).
certbot_ipa_dirsrv: true
