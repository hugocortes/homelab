- name: Start sabnzbd container
  become: true
  community.docker.docker_container:
    env:
      TZ: America/Los_Angeles
    image: linuxserver/sabnzbd:{{ version_sabnzbd }}
    name: sabnzbd
    ports:
      - 8080:8080
    restart_policy: always
    volumes:
      - /opt/sabnzbd:/config
      - downloads:/downloads

- name: Start sonarr container
  become: true
  community.docker.docker_container:
    env:
      TZ: America/Los_Angeles
    image: linuxserver/sonarr:{{ version_sonarr }}
    name: sonarr
    ports:
      - 8989:8989
    restart_policy: always
    volumes:
      - /opt/sonarr:/config
      - downloads:/downloads
      - tv:/tv

- name: Start transmission container
  become: true
  community.docker.docker_container:
    env:
      TZ: America/Los_Angeles
    image: linuxserver/transmission:{{ version_transmission }}
    name: transmission
    ports:
      - 9091:9091
      - 54949:54949/udp
      - 54949:54949
    restart_policy: always
    volumes:
      - /opt/transmission:/config
      - downloads:/downloads

- name: centos | Open firewalld ports
  ansible.builtin.import_tasks: firewalld.yaml
