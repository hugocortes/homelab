- name: Start sabnzbd container
  become: true
  community.docker.docker_container:
    env:
      TZ: America/Los_Angeles
    image: linuxserver/sabnzbd:{{ version_sabnzbd }}
    name: sabnzbd
    ports:
      - 8080:8080
    restart_policy: always
    volumes:
      - /opt/sabnzbd:/config
      - downloads:/downloads

- name: Start sonarr container
  become: true
  community.docker.docker_container:
    env:
      TZ: America/Los_Angeles
    image: linuxserver/sonarr:{{ version_sonarr }}
    name: sonarr
    ports:
      - 8989:8989
    restart_policy: always
    volumes:
      - /opt/sonarr:/config
      - downloads:/downloads
      - tv:/tv

# Transmission owns settings.json and rewrites it on shutdown: edit it only
# while the container is stopped, and only when the values differ.
- name: Transmission | Read the current settings
  become: true
  ansible.builtin.slurp:
    src: /opt/transmission/settings.json
  register: _transmission_settings_raw
  failed_when: false

- name: Transmission | Parse the current settings
  ansible.builtin.set_fact:
    _transmission_settings: >-
      {{ (_transmission_settings_raw.content | default('e30=')) | b64decode | from_json }}

- name: Transmission | Stop before editing settings.json
  become: true
  community.docker.docker_container:
    name: transmission
    state: stopped
  when:
    - _transmission_settings_raw.content is defined
    - _transmission_settings.get('blocklist-enabled') != true
      or _transmission_settings.get('lpd-enabled') != false

- name: Transmission | Blocklist on, local peer discovery off
  become: true
  ansible.builtin.replace:
    path: /opt/transmission/settings.json
    regexp: "{{ item.regexp }}"
    replace: "{{ item.replace }}"
  loop:
    - { regexp: '"blocklist-enabled": false', replace: '"blocklist-enabled": true' }
    - { regexp: '"lpd-enabled": true', replace: '"lpd-enabled": false' }
  when: _transmission_settings_raw.content is defined

- name: Transmission | Blocklist directory (the container runs as 911)
  become: true
  ansible.builtin.file:
    path: /opt/transmission/blocklists
    state: directory
    owner: "911"
    group: "911"
    mode: "0755"

- name: Transmission | Blocklist of private address ranges
  become: true
  ansible.builtin.copy:
    src: transmission-blocklist-private.txt
    dest: /opt/transmission/blocklists/private-ranges.txt
    owner: "911"
    group: "911"
    mode: "0644"
  notify: restart transmission

- name: Start transmission container
  become: true
  community.docker.docker_container:
    env:
      TZ: America/Los_Angeles
    image: linuxserver/transmission:{{ version_transmission }}
    name: transmission
    ports:
      # 9091 only: the peer port is not published. Mullvad dropped port
      # forwarding in 2023, so no peer can reach it from outside; DHT and
      # outgoing connections need no inbound port.
      - 9091:9091
    # strict: a port that is published but no longer declared gets the container
    # recreated; the module's default only checks that declared ports are present.
    comparisons:
      published_ports: strict
    restart_policy: always
    volumes:
      - /opt/transmission:/config
      - downloads:/downloads

- name: centos | Open firewalld ports
  ansible.builtin.import_tasks: firewalld.yaml
