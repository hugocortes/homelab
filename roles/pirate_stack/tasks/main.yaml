---
- name: Create nfs volumes
  become: true
  community.docker.docker_volume:
    name: "{{ item.name }}"
    driver_options:
      type: nfs
      device: ":/{{ item.mount }}"
      o: "addr={{ nfs_host }},nfsvers=4,vers=4,tcp,rw,port=2049"
  with_items:
    - name: downloads
      mount: "{{ pirate_nfs_downloads }}"
    - name: ebooks
      mount: "{{ pirate_nfs_ebooks }}"
    - name: movies
      mount: "{{ pirate_nfs_movies }}"
    - name: tv
      mount: "{{ pirate_nfs_tv }}"

- name: Create service dirs
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: nobody
    group: nobody
    state: directory
    mode: "0777"
  with_items:
    - path: /opt/calibre-server
    - path: /opt/flaresolverr
    - path: /opt/jackett
    - path: /opt/jackett/config
    - path: /opt/jackett/downloads
    - path: /opt/readarr
    - path: /opt/radarr
    - path: /opt/sabnzbd
    - path: /opt/sonarr
    - path: /opt/transmission

- name: Start calibre server container
  become: true
  community.docker.docker_container:
    env:
      TZ: America/Los_Angeles
    image: linuxserver/calibre:{{ version_calibre }}
    name: calibre-server
    ports:
      - 6060:8080
      - 6061:8081
      - 6161:8181
    restart_policy: always
    volumes:
      - /opt/calibre-server:/config
      - ebooks:/books

- name: Start flaresolverr container
  become: true
  community.docker.docker_container:
    env:
      TZ: America/Los_Angeles
    image: ghcr.io/flaresolverr/flaresolverr:{{ version_flaresolverr }}
    name: flaresolverr
    ports:
      - 8191:8191
    restart_policy: always

- name: Start jackett container
  become: true
  community.docker.docker_container:
    env:
      TZ: America/Los_Angeles
    image: linuxserver/jackett:{{ version_jackett }}
    name: jackett
    ports:
      - 9117:9117
    restart_policy: always
    volumes:
      - /opt/jackett/config:/config
      - /opt/jackett/downloads:/downloads

- name: Start radarr container
  become: true
  community.docker.docker_container:
    env:
      TZ: America/Los_Angeles
    image: linuxserver/radarr:{{ version_radarr }}
    name: radarr
    ports:
      - 7878:7878
    restart_policy: always
    volumes:
      - /opt/radarr:/config
      - downloads:/downloads
      - movies:/movies

