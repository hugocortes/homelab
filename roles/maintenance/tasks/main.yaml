---
- name: logrotate | ensure rotation actually runs
  import_tasks: logrotate.yaml
  when: maintenance_manage_logrotate | bool

- name: journald | cap journal size
  import_tasks: journald.yaml
  when: maintenance_manage_journald | bool

- name: prune | reclaim disk
  import_tasks: prune.yaml
  when: maintenance_prune | bool
  tags: prune
