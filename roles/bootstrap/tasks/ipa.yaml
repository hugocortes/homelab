---
- name: Ping to verify current user
  ansible.builtin.ping:
  ignore_unreachable: true
  ignore_errors: true
  register: _bootstrap_ping

# The probe above is *expected* to fail when the current ansible_user cannot
# log in -- that failure is the signal to swap to the IPA user. ignore_errors
# is load-bearing here, not laziness, so the rule is silenced locally rather
# than repo-wide.
- name: Clear host errors # noqa: ignore-errors
  ansible.builtin.meta: clear_host_errors
  ignore_unreachable: true
  ignore_errors: true

- name: Swap ansible_user to ipa.user
  when: (is_freeipa) and (_bootstrap_ping.failed | d(_bootstrap_ping.unreachable) | d(false))
  block:
    - name: "Set ansible_user ({{ ansible_user }}) to ipa.user ({{ ipa_user }})"
      ansible.builtin.set_fact:
        ansible_user: "{{ ipa_user }}"

    - name: Ping to verify current user
      ansible.builtin.ping:
