---
- name: certbot | Install certbot and the cloudflare dns plugin
  become: true
  ansible.builtin.dnf:
    name:
      - certbot
      - python3-certbot-dns-cloudflare
    state: present

- name: certbot | Create the config directory
  become: true
  ansible.builtin.file:
    path: /etc/letsencrypt
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: certbot | Write the cloudflare credentials
  become: true
  ansible.builtin.template:
    src: cloudflare.ini.j2
    dest: /etc/letsencrypt/cloudflare.ini
    owner: root
    group: root
    mode: "0600"
  no_log: true

# Caught here rather than at renewal time: an empty password file would make
# the hook fail unattended, 30 days before anyone had a reason to look.
- name: certbot | Refuse to configure the directory server install without a password
  when: certbot_ipa_dirsrv | bool
  ansible.builtin.assert:
    that:
      - certbot_ipa_dirman_password | length > 0
    fail_msg: >-
      certbot_ipa_dirsrv is on but certbot_ipa_dirman_password is empty.
      ipadm_password comes from group_vars/ipacluster/vault.yml -- this host
      is probably not in the ipacluster group.
    quiet: true

- name: certbot | Write the directory manager password for the deploy hook
  when: certbot_ipa_dirsrv | bool
  become: true
  ansible.builtin.copy:
    content: "{{ certbot_ipa_dirman_password }}"
    dest: "{{ certbot_ipa_dirman_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

# The rpm ships none of these; certbot creates them lazily on its first run,
# which is after we need one of them to exist.
- name: certbot | Create the renewal hook directories
  become: true
  ansible.builtin.file:
    path: "/etc/letsencrypt/renewal-hooks/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - pre
    - deploy
    - post

# Registered TWICE on purpose, and certbot does not run it twice.
#
# `certbot renew` runs the deploy directory, then skips its configured
# renew_hook when that hook is the same path it just ran ("Skipping
# deploy-hook ... as it was already run", hooks.py renew_hook). But initial
# issuance takes a different path: certonly calls hooks.deploy_hook, which
# runs ONLY the configured --deploy-hook and ignores the directory entirely
# (main.py, obtain_and_enroll_certificate).
#
# So the directory entry covers renewals, --deploy-hook on the certonly below
# covers first issuance, and dropping either one leaves a hole. Removing the
# apparent redundancy means the certificate silently never reaches the
# directory server on the run that first creates it.
- name: certbot | Install the deploy hook
  become: true
  ansible.builtin.template:
    src: deploy-hook.sh.j2
    dest: /etc/letsencrypt/renewal-hooks/deploy/publish-and-reload.sh
    owner: root
    group: root
    mode: "0755"

- name: certbot | Ensure the publish directory exists
  become: true
  ansible.builtin.file:
    path: "{{ certbot_deploy_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# argv is built as one list rather than a YAML sequence with a templated tail,
# because the domains have to expand into SEPARATE elements. Written as
# `-d` + join(' ') they collapse into the single argument `-dipa-0.example`,
# which argparse reads as bundled short flags and rejects with the splendidly
# unhelpful "Action corresponding to argument -p is None". `--domain=` also
# survives a value that starts with a dash, which bare `-d` would not.
- name: certbot | Obtain the certificate
  become: true
  ansible.builtin.command:
    argv: >-
      {{
        [
          'certbot',
          'certonly',
          '--non-interactive',
          '--agree-tos',
          '--email=' ~ certbot_email,
          '--dns-cloudflare',
          '--dns-cloudflare-credentials=/etc/letsencrypt/cloudflare.ini',
          '--dns-cloudflare-propagation-seconds=' ~ certbot_dns_propagation_seconds,
          '--cert-name=' ~ certbot_common_name,
          '--staging' if certbot_staging | bool else '--no-eff-email',
          '--deploy-hook=/etc/letsencrypt/renewal-hooks/deploy/publish-and-reload.sh',
        ] + (certbot_domains | map('regex_replace', '^', '--domain=') | list)
      }}
    creates: /etc/letsencrypt/live/{{ certbot_common_name }}/fullchain.pem

# The package ships certbot-renew.timer, which runs `certbot renew` twice
# daily. Renewal only acts inside the last 30 days of validity, so this is the
# whole of the automation -- no playbook run is involved.
- name: certbot | Check whether the renewal timer unit exists yet
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/certbot-renew.timer
  register: _certbot_timer_unit
  changed_when: false
  check_mode: false

- name: certbot | Enable the renewal timer
  become: true
  ansible.builtin.systemd:
    name: certbot-renew.timer
    enabled: true
    state: started
  # Under --check the package above was not really installed, so the unit does
  # not exist yet and enabling it would fail spuriously.
  when: _certbot_timer_unit.stat.exists or not ansible_check_mode

- name: certbot | Report renewal status
  become: true
  ansible.builtin.command: certbot certificates --cert-name={{ certbot_common_name }}
  register: _certbot_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: certbot | Show what is managed
  ansible.builtin.debug:
    msg: "{{ _certbot_status.stdout_lines | default(['(not yet issued)']) }}"
