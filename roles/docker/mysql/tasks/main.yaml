---
- name: Create network
  community.docker.docker_network:
    name: mysql

- name: Create service dirs
  ansible.builtin.file:
    group: nobody
    mode: "0777"
    owner: nobody
    path: "{{ item.path }}"
    state: directory
  with_items:
    - path: /opt/mysql

- name: Start mysql container
  become: true
  community.docker.docker_container:
    env:
      MYSQL_ROOT_PASSWORD: "{{ global.mysql.password }}"
    image: mysql:8.4.8
    name: mysql
    networks:
      - name: mysql
    # not published: ombi reaches mysql over the 'mysql' network by name.
    # published_ports defaults to allow_more_present, so an empty list alone will
    # NOT unpublish an already-running container -- strict is required.
    ports: []
    comparisons:
      published_ports: strict
    restart_policy: always
    volumes:
      - /opt/mysql:/var/lib/mysql

- name: Start exporter container
  become: true
  community.docker.docker_container:
    command:
      - "--mysqld.username=root:{{ global.mysql.password }}"
      - "--mysqld.address=mysql:3306"
    image: prom/mysqld-exporter:v0.15.1
    name: mysql-metrics
    networks:
      - name: mysql
    ports:
      - 9104:9104
    restart_policy: always

- name: centos | Open firewalld ports
  ansible.builtin.import_tasks: firewalld.yaml
  when: is_centos
