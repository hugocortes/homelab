---
- name: centos | Install packages
  ansible.builtin.import_tasks: centos.yaml
  when: is_centos

- name: Create database
  postgresql_db:
    login_host: "{{ homelab.postgresql_host }}"
    login_user: "{{ homelab.postgresql_user }}"
    login_password: "{{ homelab.postgresql_pass }}"
    name: "{{ database_name }}"

- name: Create database user
  postgresql_user:
    login_host: "{{ homelab.postgresql_host }}"
    login_user: "{{ homelab.postgresql_user }}"
    login_password: "{{ homelab.postgresql_pass }}"
    db: "{{ database_name }}"
    name: "{{ database_user }}"
    password: "{{ database_pass }}"

- name: Grant all database privileges to user
  postgresql_privs:
    login_host: "{{ homelab.postgresql_host }}"
    login_user: "{{ homelab.postgresql_user }}"
    login_password: "{{ homelab.postgresql_pass }}"
    db: "{{ database_name }}"
    privs: ALL
    type: database
    obj: "{{ database_name }}"
    role: "{{ database_user }}"

- name: Grant all ALL_IN_SCHEMA privileges to user
  postgresql_privs:
    login_host: "{{ homelab.postgresql_host }}"
    login_user: "{{ homelab.postgresql_user }}"
    login_password: "{{ homelab.postgresql_pass }}"
    db: "{{ database_name }}"
    privs: ALL
    objs: ALL_IN_SCHEMA
    role: "{{ database_user }}"
    type: "{{ item }}"
  with_items:
    - table
    - sequence
