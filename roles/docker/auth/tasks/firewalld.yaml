- name: centos | open pomerium services
  include_role:
    name: services/firewalld
  vars:
    firewalld_rule_name: pomerium
    firewalld_ports:
    - name: pomerium
      port: 8080/tcp

- name: centos | open keycloak services
  include_role:
    name: services/firewalld
  vars:
    firewalld_rule_name: keycloak
    firewalld_ports:
    - name: keycloak
      port: 7080/tcp
