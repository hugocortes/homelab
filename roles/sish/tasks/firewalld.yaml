---
- name: centos | Open bastion ports
  ansible.builtin.include_role:
    name: firewalld
  vars:
    firewalld_rule_name: bastion
    firewalld_ports:
      - name: bastion sish ssh server
        port: "{{ homelab.sish.sshPort }}/tcp"
      - name: bastion sish http
        port: "{{ homelab.sish.forwardingPorts.http }}/tcp"
      - name: bastion sish https
        port: "{{ homelab.sish.forwardingPorts.https }}/tcp"

# Was: tcpPorts, with a nested '{{ item }}/tcp' inside an expression that was
# already Jinja. Renamed for the pattern rule and the interpolation corrected.
- name: Create tcp port var
  ansible.builtin.set_fact:
    sish_tcp_ports: "{{ sish_tcp_ports | default([]) + [{'name': 'tcp forwarding port', 'port': item ~ '/tcp'}] }}"
  loop: "{{ homelab.sish.forwardingPorts.tcp }}"

- name: centos | Open bastion ports
  ansible.builtin.include_role:
    name: firewalld
  vars:
    firewalld_rule_name: bastion
    firewalld_ports: "{{ sish_tcp_ports }}"
