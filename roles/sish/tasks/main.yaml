---
- name: Set sish docker ports
  ansible.builtin.set_fact:
    sish_ports:
      - "{{ sish_ssh_port }}:{{ sish_ssh_port }}"
      - "{{ sish_forwarding_ports_http }}:{{ sish_forwarding_ports_http }}"
      - "{{ sish_forwarding_ports_https }}:{{ sish_forwarding_ports_https }}"

# Was: ports: "{{ ports }} + ['{{ item }}:{{ item }}']" -- the `+` sat OUTSIDE
# the Jinja expression, so this built a string rather than appending to a list.
- name: Append tcp ports
  ansible.builtin.set_fact:
    sish_ports: "{{ sish_ports + [item ~ ':' ~ item] }}"
  loop: "{{ sish_forwarding_ports_tcp }}"

- name: Launch sish container
  become: true
  community.docker.docker_container:
    name: sish
    image: "antoniomika/sish:{{ sish_tag }}"
    restart_policy: unless-stopped
    hostname: "{{ inventory_hostname }}"
    ports: "{{ sish_ports }}"
    command: >-
      --ssh-address=:{{ sish_ssh_port }}
      --http-address=:{{ sish_forwarding_ports_http }}
      --https-address=:{{ sish_forwarding_ports_https }}
      --https=true
      --https-certificate-directory=/ssl
      --https-ondemand-certificate=true
      --authentication=true
      --authentication-password=""
      --authentication-keys-directory=/pubkeys
      --private-key-location=/keys/ssh_key
      --private-key-passphrase={{ sish_private_key_passphrase }}
      --bind-random-ports=false
      --bind-random-subdomains=false
      --domain={{ sish_domain }}
      --idle-connection-timeout=600s
    volumes:
      - "~/sish/ssl:/ssl"
      - "~/sish/keys:/keys"
      - "~/sish/pubkeys:/pubkeys"

- name: centos | Open firewalld ports
  ansible.builtin.import_tasks: firewalld.yaml
  when: is_centos
