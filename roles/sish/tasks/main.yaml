---
- name: Set sish docker ports
  ansible.builtin.set_fact:
    sish_ports:
      - "{{ homelab.sish.sshPort }}:{{ homelab.sish.sshPort }}"
      - "{{ homelab.sish.forwardingPorts.http }}:{{ homelab.sish.forwardingPorts.http }}"
      - "{{ homelab.sish.forwardingPorts.https }}:{{ homelab.sish.forwardingPorts.https }}"

# Was: ports: "{{ ports }} + ['{{ item }}:{{ item }}']" -- the `+` sat OUTSIDE
# the Jinja expression, so this built a string rather than appending to a list.
- name: Append tcp ports
  ansible.builtin.set_fact:
    sish_ports: "{{ sish_ports + [item ~ ':' ~ item] }}"
  loop: "{{ homelab.sish.forwardingPorts.tcp }}"

- name: Launch sish container
  become: true
  community.docker.docker_container:
    name: sish
    image: "antoniomika/sish:{{ homelab.sish.tag }}"
    restart_policy: unless-stopped
    hostname: "{{ inventory_hostname }}"
    ports: "{{ sish_ports }}"
    command: >-
      --ssh-address=:{{ homelab.sish.sshPort }}
      --http-address=:{{ homelab.sish.forwardingPorts.http }}
      --https-address=:{{ homelab.sish.forwardingPorts.https }}
      --https=true
      --https-certificate-directory=/ssl
      --https-ondemand-certificate=true
      --authentication=true
      --authentication-password=""
      --authentication-keys-directory=/pubkeys
      --private-key-location=/keys/ssh_key
      --private-key-passphrase={{ homelab.sish.privateKeyPassphrase }}
      --bind-random-ports=false
      --bind-random-subdomains=false
      --domain={{ homelab.sish.domain }}
      --idle-connection-timeout=600s
    volumes:
      - "~/sish/ssl:/ssl"
      - "~/sish/keys:/keys"
      - "~/sish/pubkeys:/pubkeys"

- name: centos | Open firewalld ports
  ansible.builtin.import_tasks: firewalld.yaml
  when: is_centos
