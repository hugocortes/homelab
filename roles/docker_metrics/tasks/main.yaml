---
- name: Launch node-exporter container
  become: true
  community.docker.docker_container:
    name: node-exporter
    image: prom/node-exporter:v1.12.1
    restart_policy: unless-stopped
    command: --path.rootfs=/hostfs
    hostname: "{{ inventory_hostname }}"
    ports:
      - 9100:9100
    volumes:
      - /:/hostfs

- name: Launch cadvisor container
  become: true
  community.docker.docker_container:
    name: cadvisor
    image: ghcr.io/google/cadvisor:v0.60.6
    restart_policy: unless-stopped
    hostname: "{{ inventory_hostname }}"
    ports:
      - 9080:8080
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

- name: centos | Open firewalld ports
  ansible.builtin.import_tasks: firewalld.yaml
  when: is_centos
