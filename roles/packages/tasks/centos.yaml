---
- name: centos | Install python and kernel headers
  become: true
  ansible.builtin.dnf:
    name:
      - dnf
      - kernel-devel
      - kernel-headers
      - kernel-modules-extra
      - linux-firmware
      # `python3` is the distro's default interpreter: 3.9 on el9, 3.12 on
      # el10. Never name a specific minor version here -- the old list pinned
      # python3.9, which simply does not exist on el10.
      - python3
      # TODO(el10): dnf5 replaces this with python3-libdnf5. Cannot verify
      # without an el10 host; confirm before the in-place upgrade.
      - python3-dnf
      - python3-pip
      # provides /usr/bin/python. The role used to create that symlink by hand
      # over an RPM-owned path; this is the packaged way to get it.
      - python-unversioned-command
    state: present

# The two `file: state=link force=yes` tasks that used to live here pointed
# /usr/bin/python3 at /usr/bin/python3.9 and /usr/bin/python at
# /usr/bin/python3. Both paths are already owned and correctly linked by their
# RPMs, so the tasks were redundant -- and because they wrote ABSOLUTE targets
# where the packages record RELATIVE ones, every run left rpm -V reporting:
#
#     ....L....    /usr/bin/python3            (python3)
#     ....L....    /usr/bin/python             (python-unversioned-command)
#
#     rpm expects  /usr/bin/python3 -> python3.9   on disk -> /usr/bin/python3.9
#     rpm expects  /usr/bin/python  -> ./python3   on disk -> /usr/bin/python3
#
# Functionally equivalent, so nothing broke, but the packages have been
# flagged as modified for years. leapp inspects RPM state during an in-place
# el9 -> el10 upgrade, so this is worth repairing before that.
# rpm -V (verify) has no module equivalent -- the rpm_key/dnf modules manage
# packages, they do not report file-level drift. Genuine command territory.
- name: centos | Check whether the python symlinks still match their rpms # noqa: command-instead-of-module
  become: true
  ansible.builtin.command: rpm -V python3 python-unversioned-command
  register: _packages_python_rpm_verify
  changed_when: false
  failed_when: false
  check_mode: false

- name: centos | Restore rpm-owned python symlinks
  become: true
  ansible.builtin.command: dnf -y reinstall python3 python-unversioned-command
  when: "'/usr/bin/python' in (_packages_python_rpm_verify.stdout | default(''))"
  register: _packages_python_restore
  changed_when: _packages_python_restore.rc == 0
  # Version-agnostic on purpose: reinstalling restores whatever the packages
  # record, so this keeps working on el10 without naming an interpreter.

- name: centos | Install epel-release
  become: true
  ansible.builtin.dnf:
    name: epel-release
    state: present

- name: centos | Install baseline packages
  become: true
  ansible.builtin.dnf:
    name:
      - curl
      - git
      - glibc-common
      - nfs-utils
      - python3-libselinux
      - sshpass
      - tar
      - tmux
      - tree # display directory tree
      - util-linux-user
      - vim
      - zsh
    state: present

- name: centos | Remove packages we do not want
  become: true
  ansible.builtin.dnf:
    name:
      - collectd-rrdtool
      - subscription-manager
    state: absent

- name: centos | Remove leftover collectd rrd data
  become: true
  ansible.builtin.file:
    path: /var/lib/collectd/rrd
    state: absent

- name: centos | Upgrade every package on the host
  become: true
  ansible.builtin.dnf:
    name: "*"
    state: latest
  when: packages_upgrade_all | bool
