---
# The appimage tracks `nightly`, so re-downloading always produces a different
# build. Install when nvim is absent, refresh only on an explicit upgrade run,
# so an ordinary converge run stays idempotent.
- name: neovim | Check whether it is already installed
  ansible.builtin.stat:
    path: /usr/bin/nvim
  register: _packages_neovim

- name: neovim | Install
  when: not _packages_neovim.stat.exists or (packages_upgrade_all | bool)
  block:
    - name: neovim | Download appimage
      become: false
      ansible.builtin.get_url:
        url: "{{ packages_neovim_url }}"
        dest: /tmp/nvim.appimage
        mode: "0755"
        force: true

    - name: neovim | Extract appimage
      become: false
      ansible.builtin.command: /tmp/nvim.appimage --appimage-extract
      args:
        chdir: /tmp
      changed_when: true

    # The old install has to go before the new one lands: `mv src dst` with dst
    # an existing directory moves src INSIDE it, giving
    # /opt/squashfs-root/squashfs-root and "File exists" on every run after.
    #
    # Both halves of the swap are gated on the replacement actually being on
    # disk, so a failed or skipped extraction can never delete a working nvim
    # and leave /usr/bin/nvim dangling. `mv` deliberately carries no `removes:`
    # guard -- reaching it with nothing to move is a bug, and should say so.
    - name: neovim | Confirm the extraction landed
      ansible.builtin.stat:
        path: /tmp/squashfs-root
      register: _packages_neovim_extracted

    - name: neovim | Swap the new extraction into /opt
      when: _packages_neovim_extracted.stat.isdir | default(false)
      block:
        - name: neovim | Remove the previous extraction
          become: true
          ansible.builtin.file:
            path: /opt/squashfs-root
            state: absent

        - name: neovim | Move into /opt
          become: true
          ansible.builtin.command: mv /tmp/squashfs-root /opt/squashfs-root
          changed_when: true

    - name: neovim | Link into path
      become: true
      ansible.builtin.file:
        src: /opt/squashfs-root/AppRun
        dest: /usr/bin/nvim
        state: link
        force: true
