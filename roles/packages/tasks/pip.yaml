---
# The old role shelled out to `python -m ensurepip --upgrade` and
# `pip install packaging` via `command`, both unconditionally and both always
# reporting changed. python3-pip comes from the distro package list above, so
# ensurepip is redundant; the pip module covers the rest idempotently.
- name: python | Install build prerequisites
  become: false
  ansible.builtin.pip:
    name:
      - packaging
      - setuptools
      - setuptools_rust
      - wheel
    state: "{{ 'latest' if packages_upgrade_all | bool else 'present' }}"
    extra_args: --user
  # setuptools_rust needs a rust toolchain that is not present on every host
  ignore_errors: true

- name: python | Install user pip packages
  become: false
  ansible.builtin.pip:
    name: "{{ packages_pip }}"
    state: "{{ 'latest' if packages_upgrade_all | bool else 'present' }}"
    extra_args: --user
