---
# NOTE: this role is not referenced by any playbook, and homelab.nfs_mount_paths
# is not defined anywhere in the inventory -- so it cannot run as written. The
# docker roles mount NFS via docker_volume rather than host fstab entries, which
# is probably why it fell out of use. Left in place rather than deleted; it needs
# a decision, not a guess.
- name: centos | Install packages
  ansible.builtin.import_tasks: centos.yaml
  when: is_centos

- name: Create nfs mount path dir
  ansible.builtin.file:
    path: "{{ item.client }}"
    state: directory
    mode: "0755"
  with_items:
    - "{{ homelab.nfs_mount_paths }}"

- name: Auto mount nfs share
  ansible.builtin.lineinfile:
    dest: /etc/fstab
    regexp: "{{ homelab.nfs.host }}:{{ item.host }} {{ item.client }} nfs4 defaults,proto=tcp,port=2049,rw 0 0"
    line: "{{ homelab.nfs.host }}:{{ item.host }} {{ item.client }} nfs4 defaults,proto=tcp,port=2049,rw 0 0"
    state: present
    insertbefore: "exit 0"
  with_items:
    - "{{ homelab.nfs_mount_paths }}"
  register: _nfs_fstab

# Was a task gated on `when: _nfs_fstab is changed`, which is precisely what a
# handler does -- and as a task it fired mid-role rather than at the end.
- name: Reboot
  ansible.builtin.reboot:
    reboot_timeout: 60
  when: _nfs_fstab is changed # noqa: no-handler
