---
- name: firewalld | check whether it is installed
  stat:
    path: /usr/sbin/firewalld
  register: _firewalld_binary
  changed_when: false
  check_mode: false

- name: firewalld | install and start
  import_tasks: install.yaml
  when: firewalld_manage_package | bool

- name: firewalld | skip rules because firewalld is absent
  debug:
    msg: >-
      firewalld is not installed on {{ inventory_hostname }} and
      firewalld_manage_package is false, so the
      "{{ firewalld_rule_name }}" rules were NOT applied. Enabling firewalld
      here needs its complete rule set in the same change -- see AI-23.
  when:
    - not _firewalld_binary.stat.exists
    - not (firewalld_manage_package | bool)

- name: "{{ firewalld_rule_name }} | open ports"
  import_tasks: port.yaml
  when:
    - firewalld_ports | length > 0
    - _firewalld_binary.stat.exists or (firewalld_manage_package | bool)

- name: "{{ firewalld_rule_name }} | open services"
  import_tasks: service.yaml
  when:
    - firewalld_services | length > 0
    - _firewalld_binary.stat.exists or (firewalld_manage_package | bool)
