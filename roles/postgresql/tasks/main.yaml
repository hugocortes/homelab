---
- name: Create network
  community.docker.docker_network:
    name: postgres

# /opt/postgres is the bitnami 15 data dir, left in place for rollback until
# the 18 migration is known good (docs/postgres-18-migration.md). Nothing
# mounts it any more.
- name: Create data dir
  ansible.builtin.file:
    group: root
    mode: "0755"
    owner: root
    path: /opt/postgresql
    state: directory

- name: Start container
  become: true
  community.docker.docker_container:
    env:
      POSTGRES_USER: "{{ postgresql_username }}"
      POSTGRES_PASSWORD: "{{ postgresql_password }}"
      PGUSER: postgres
    # Official image. From 18 it keeps PGDATA at /var/lib/postgresql/<major>/docker
    # and expects the mount one level up, so the next major can pg_upgrade
    # --link within the same mount. Pinned to the Debian release as well:
    # a base-image swap changes glibc, and with it collation order.
    image: postgres:18.6-trixie
    name: postgres
    networks:
      - name: postgres
    # unpublished unless postgresql_publish: consumers reach postgres over the
    # 'postgres' network by name.
    # published_ports defaults to allow_more_present, so an empty list alone will
    # NOT unpublish an already-running container -- strict is required.
    ports: "{{ ['5432:5432'] if postgresql_publish else [] }}"
    comparisons:
      published_ports: strict
    restart_policy: always
    volumes:
      - /opt/postgresql:/var/lib/postgresql

- name: Start exporter container
  become: true
  community.docker.docker_container:
    env:
      DATA_SOURCE_URI: "postgres:5432/?sslmode=disable"
      DATA_SOURCE_USER: "{{ postgresql_username }}"
      DATA_SOURCE_PASS: "{{ postgresql_password }}"
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    name: postgresql-metrics
    networks:
      - name: postgres
    ports:
      - 9187:9187
    restart_policy: unless-stopped

- name: centos | Open firewalld ports
  ansible.builtin.import_tasks: firewalld.yaml
  when: is_centos
