---
- name: centos | Open pomerium services
  ansible.builtin.include_role:
    name: firewalld
  vars:
    firewalld_rule_name: pomerium
    firewalld_ports:
      - name: pomerium
        port: 8080/tcp

- name: centos | Open keycloak services
  ansible.builtin.include_role:
    name: firewalld
  vars:
    firewalld_rule_name: keycloak
    firewalld_ports:
      - name: keycloak
        port: 7080/tcp
