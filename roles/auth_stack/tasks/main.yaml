---
- name: Create service dirs
  ansible.builtin.file:
    group: nobody
    mode: "0777"
    owner: nobody
    path: "{{ item.path }}"
    state: directory
  with_items:
    - path: /opt/pomerium
    - path: /opt/keycloak
    - path: /opt/keycloak/providers

- name: Download keycloakify theme
  ansible.builtin.get_url:
    url: https://storage.googleapis.com/homelabops-public/keycloakify.jar
    dest: /opt/keycloak/providers/keycloakify.jar
    force: true
    mode: "0644"

- name: Start pomerium container
  become: true
  community.docker.docker_container:
    image: pomerium/pomerium:{{ version_pomerium }}
    name: pomerium
    ports:
      - 8080:8080
    restart_policy: always
    volumes:
      - /opt/pomerium/config.yaml:/pomerium/config.yaml:ro

- name: Start keycloak container
  become: true
  community.docker.docker_container:
    command: start --db=postgres --hostname-strict=false --proxy-headers=xforwarded
    # entrypoint:
    #   - /bin/bash
    #   - -c
    #   - /opt/keycloak/bin/kc.sh build
    #   - /opt/keycloak/bin/kc.sh start --optimized --hostname-strict=false
    env:
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"

      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: "{{ postgresql_keycloak_database }}"
      KC_DB_SCHEMA: public
      KC_DB_USERNAME: "{{ postgresql_keycloak_username }}"
      KC_DB_PASSWORD: "{{ postgresql_keycloak_password }}"

      X509_CA_BUNDLE: /etc/x509/https/ipa-0.homelabops.dev.intermediate.crt /etc/x509/https/ipa-0.homelabops.dev.intermediate-2.crt
        /etc/x509/https/ipa-0.homelabops.dev.root.crt
    image: quay.io/keycloak/keycloak:{{ version_keycloak }}
    name: keycloak
    networks:
      - name: postgres
    ports:
      - 7080:8080
    restart_policy: always
    volumes:
      - /opt/keycloak/providers:/opt/keycloak/providers
      - /opt/keycloak/secrets:/secrets/auth
      - /opt/keycloak/x509:/etc/x509/https

- name: centos | Open firewalld ports
  ansible.builtin.import_tasks: firewalld.yaml
  when: is_centos
