---
- name: Create service dirs
  ansible.builtin.file:
    group: nobody
    mode: "0777"
    owner: nobody
    path: "{{ item.path }}"
    state: directory
  with_items:
    - path: /opt/pomerium
    - path: /opt/keycloak
    - path: /opt/keycloak/providers

- name: Download keycloakify theme
  ansible.builtin.get_url:
    url: https://storage.googleapis.com/homelabops-public/keycloakify.jar
    dest: /opt/keycloak/providers/keycloakify.jar
    force: true
    mode: "0644"

- name: Write pomerium config
  become: true
  ansible.builtin.template:
    src: pomerium-config.yaml.j2
    dest: /opt/pomerium/config.yaml
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: restart pomerium

- name: Start pomerium container
  become: true
  community.docker.docker_container:
    image: pomerium/pomerium:{{ version_pomerium }}
    name: pomerium
    ports:
      - 8080:8080
    restart_policy: always
    volumes:
      - /opt/pomerium/config.yaml:/pomerium/config.yaml:ro

# The theme image is FROM scratch: one jar, nothing to run. Copy it out of a
# throwaway container into a temp dir, then let copy decide by checksum whether
# providers/ actually changed. Only that restarts Keycloak; Pomerium leans on it.
- name: Log into ghcr.io
  become: true
  community.docker.docker_login:
    registry_url: ghcr.io
    username: "{{ ghcr_username }}"
    password: "{{ ghcr_read_token }}"

- name: Pull kitchenriff theme image
  become: true
  community.docker.docker_image:
    name: ghcr.io/hugocortes/kitchenriff-keycloak-theme
    tag: "{{ kitchenriff_theme_version }}"
    source: pull

- name: Install kitchenriff theme
  when: not ansible_check_mode
  block:
    - name: Create kitchenriff theme staging dir
      become: true
      ansible.builtin.tempfile:
        state: directory
        suffix: kitchenriff-theme
      register: auth_stack_theme_tmp
      changed_when: false

    # No CMD in a scratch image, so `none` is only there to satisfy create.
    - name: Create kitchenriff theme container
      become: true
      community.docker.docker_container:
        command: none
        image: ghcr.io/hugocortes/kitchenriff-keycloak-theme:{{ kitchenriff_theme_version }}
        name: kitchenriff-theme
        state: present
      changed_when: false

    - name: Copy kitchenriff theme jar out of the image
      become: true
      ansible.builtin.command:
        argv:
          - docker
          - cp
          - kitchenriff-theme:/kitchenriff-keycloak-theme.jar
          - "{{ auth_stack_theme_tmp.path }}/kitchenriff-keycloak-theme.jar"
      changed_when: false

    - name: Install kitchenriff theme jar
      become: true
      ansible.builtin.copy:
        src: "{{ auth_stack_theme_tmp.path }}/kitchenriff-keycloak-theme.jar"
        dest: /opt/keycloak/providers/kitchenriff-keycloak-theme.jar
        remote_src: true
        mode: "0644"
      notify: restart keycloak

  always:
    - name: Remove kitchenriff theme container
      become: true
      community.docker.docker_container:
        name: kitchenriff-theme
        state: absent
      changed_when: false

    - name: Remove kitchenriff theme staging dir
      become: true
      ansible.builtin.file:
        path: "{{ auth_stack_theme_tmp.path }}"
        state: absent
      when: auth_stack_theme_tmp.path is defined
      changed_when: false

- name: Start keycloak container
  become: true
  community.docker.docker_container:
    command: start --db=postgres --hostname-strict=false --proxy-headers=xforwarded
    # entrypoint:
    #   - /bin/bash
    #   - -c
    #   - /opt/keycloak/bin/kc.sh build
    #   - /opt/keycloak/bin/kc.sh start --optimized --hostname-strict=false
    env:
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"

      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: "{{ postgresql_keycloak_database }}"
      KC_DB_SCHEMA: public
      KC_DB_USERNAME: "{{ postgresql_keycloak_username }}"
      KC_DB_PASSWORD: "{{ postgresql_keycloak_password }}"

      X509_CA_BUNDLE: /etc/x509/https/ipa-0.homelabops.dev.intermediate.crt /etc/x509/https/ipa-0.homelabops.dev.intermediate-2.crt
        /etc/x509/https/ipa-0.homelabops.dev.root.crt
    image: quay.io/keycloak/keycloak:{{ version_keycloak }}
    name: keycloak
    networks:
      - name: postgres
    ports:
      - 7080:8080
    restart_policy: always
    volumes:
      - /opt/keycloak/providers:/opt/keycloak/providers
      - /opt/keycloak/secrets:/secrets/auth
      - /opt/keycloak/x509:/etc/x509/https

- name: centos | Open firewalld ports
  ansible.builtin.import_tasks: firewalld.yaml
  when: is_centos
